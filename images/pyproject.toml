[project]
name = "tukey-images"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fonttools>=4.63.0",
  "resvg-py>=0.5.0",
]

[dependency-groups]
dev = [
  "ruff>=0.17.1",
]

[tool.ruff.lint]
extend-select = [
  "I", # import sorting
  "UP", # modern syntax for the Python version in requires-python
  "B", # likely bugs: mutable defaults, loop variable capture, ...
]
