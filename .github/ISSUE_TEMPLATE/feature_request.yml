name: Feature request
description: A new function, feature, or an option tukey doesn't support yet
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The [roadmap](https://github.com/cxd309/tukey/blob/main/docs/roadmap.md) lists features that are currently planned.
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: The function or option, and what it does.
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Ported from
      description: Where this feature already exists, if anywhere.
      multiple: true
      options:
        - SciPy
        - NumPy
        - MATLAB
        - None, it's original to tukey
    validations:
      required: true
  - type: input
    id: equivalent
    attributes:
      label: Equivalent function
      description: The function or option name in each library you picked.
      placeholder: SciPy `scipy.signal.upfirdn`, MATLAB `matlab upfirdn`
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What you're trying to do, and why the current API doesn't cover it.
